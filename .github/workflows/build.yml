name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Przykłady wymiany (kontrakt z Rytmu Snu)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/rafal6283/nocny-licznik /tmp/nl
          git -C /tmp/nl sparse-checkout set packages/koofr_sync/wymiana packages/koofr_sync/test
          mkdir -p app/src/test/resources/wymiana app/src/test/resources/koofr
          cp /tmp/nl/packages/koofr_sync/wymiana/*.json app/src/test/resources/wymiana/
          cp /tmp/nl/packages/koofr_sync/test/vectors.json app/src/test/resources/koofr/

      - name: Testy
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log || {
            grep -E "FAILED|^e: |What went wrong" -A3 test.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -A6 "<failure" "$f" | head -24; done
            exit 1
          }

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Doba-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Doba-${{ github.run_number }}
          path: Doba-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Doba ${{ github.run_number }}
          files: Doba-*.apk
          make_latest: true
